# Logs the owner into the XFCE desktop at boot, so a restart comes back just as hyde was: the
# desktop session is what gives the owner's account the sound card (not in group audio; the
# mic and speakers are Jarvis's) and what keeps lid-close from suspending (xfce4-power-manager).
#   sudo cp ~/jarvis/deploy/lightdm-autologin.conf /etc/lightdm/lightdm.conf.d/80-autologin.conf
[Seat:*]
autologin-user=nate
autologin-user-timeout=0
