# spotifyd: makes this laptop a Spotify device called "Jarvis" that plays out of the same speaker
# Jarvis talks through (PulseAudio's default sink, the echo-cancel sink, so the mic still hears
# "Hey Jarvis" over the music). Installed as ~/.config/spotifyd/spotifyd.conf; README: Spotify setup.
[global]
device_name = "Jarvis"
device_type = "speaker"
backend = "pulseaudio"
volume_controller = "softvol"
initial_volume = 60
volume_normalisation = true
bitrate = 320
no_audio_cache = true
autoplay = true
use_mpris = false
