# Echo cancellation for Jarvis: the mic (Brio webcam) with the speakers' sound removed, so
# Jarvis can hear "stop" while it is talking. Made the default source and sink by Jarvis setup.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.gain_control = false
        webrtc.extended_filter = true
        webrtc.noise_suppression = false
      }
      capture.props = {
        node.name = "echo-cancel-capture"
        target.object = "alsa_input.usb-046d_Brio_101_2539AP9F4LX8-02.mono-fallback"
        node.passive = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Mic (echo cancelled)"
      }
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Speakers (echo cancelled)"
      }
      playback.props = {
        node.name = "echo-cancel-playback"
        target.object = "alsa_output.pci-0000_05_00.6.HiFi__hw_Generic_1__sink"
        node.passive = true
      }
    }
  }
]
